<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imperio Command Center</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet">
    <style>
        :root {
            --crimson: #5C0A0A;
            --crimson-light: #8B0000;
            --gold: #C5A028;
            --gold-light: #D4AF37;
            --gold-pale: #F5E6C0;
            --obsidian: #0A0A0F;
            --deep: #0D1117;
            --navy: #141821;
            --navy-mid: #1C2333;
            --navy-light: #242D40;
            --border: rgba(197,160,40,0.2);
            --border-h: rgba(197,160,40,0.45);
            --text: #F0E8D5;
            --text2: #9BA3B8;
            --muted: #5C6478;
            --green: #22C55E;
            --danger: #8B2020;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:var(--deep); color:var(--text); font-family:'Crimson Pro',Georgia,serif; font-size:15px; min-height:100vh; }

        /* ── BRANDED HEADER ── */
        .header {
            background: linear-gradient(180deg, #3a0505 0%, #5C0A0A 40%, #4a0808 100%);
            border-bottom: 2.5px solid var(--gold);
            height: 90px;
            display: flex;
            align-items: stretch;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 3px 24px rgba(0,0,0,0.7);
            overflow: hidden;
        }
        .header::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 50% -20%, rgba(197,160,40,0.08) 0%, transparent 60%);
            pointer-events: none;
        }
        .header-logo {
            display: flex;
            align-items: center;
            padding: 6px 16px 6px 12px;
            border-right: 1px solid rgba(197,160,40,0.25);
        }
        .header-logo img {
            height: 72px;
            width: auto;
            object-fit: contain;
        }
        .header-center {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            padding: 0 1rem;
        }
        .header-title {
            font-family: 'Cinzel', serif;
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--gold);
            letter-spacing: 0.2em;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(197,160,40,0.3);
        }
        .header-sub {
            font-size: 0.68rem;
            color: rgba(197,160,40,0.65);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            font-family: 'Cinzel', serif;
        }
        .header-certs {
            display: flex;
            gap: 6px;
            margin-top: 2px;
        }
        .cert-pill {
            font-size: 0.6rem;
            font-family: 'Cinzel', serif;
            letter-spacing: 0.08em;
            color: var(--gold);
            border: 1px solid rgba(197,160,40,0.35);
            background: rgba(197,160,40,0.08);
            padding: 1px 7px;
            border-radius: 10px;
        }
        .header-right {
            display: flex;
            align-items: center;
            padding: 6px 14px 6px 12px;
            gap: 12px;
            border-left: 1px solid rgba(197,160,40,0.25);
        }
        .header-founder-info {
            text-align: right;
        }
        .founder-name {
            font-family: 'Cinzel', serif;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--gold);
            letter-spacing: 0.06em;
        }
        .founder-title {
            font-size: 0.7rem;
            color: var(--text2);
            margin-top: 1px;
        }
        .founder-clearance {
            font-size: 0.62rem;
            color: rgba(197,160,40,0.55);
            letter-spacing: 0.05em;
            margin-top: 2px;
        }
        .header-headshot {
            width: 62px;
            height: 62px;
            border-radius: 50%;
            border: 2px solid var(--gold);
            object-fit: cover;
            object-position: center top;
            box-shadow: 0 0 12px rgba(197,160,40,0.25);
        }
        .header-status {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.65rem;
            color: var(--muted);
            letter-spacing: 0.06em;
            margin-top: 3px;
        }
        .status-dot { width:6px; height:6px; border-radius:50%; background:var(--green); box-shadow:0 0 6px var(--green); animation:pulse 2s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

        /* ── LAYOUT ── */
        .app { display:flex; height:calc(100vh - 90px); }
        .sidebar { width:210px; background:var(--navy); border-right:1px solid var(--border); overflow-y:auto; flex-shrink:0; }
        .main { flex:1; overflow-y:auto; padding:1.75rem 2rem; }
        .sidebar-section { padding:.85rem .75rem .35rem; font-size:.6rem; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-family:'Cinzel',serif; }
        .nav-btn { display:flex; align-items:center; gap:.6rem; width:100%; padding:.52rem 1rem; background:none; border:none; cursor:pointer; color:var(--text2); font-family:'Crimson Pro',serif; font-size:.88rem; transition:all .15s; text-align:left; border-left:2px solid transparent; }
        .nav-btn:hover { color:var(--text); background:rgba(197,160,40,0.06); }
        .nav-btn.active { color:var(--gold); background:rgba(197,160,40,0.1); border-left-color:var(--gold); }
        .nav-btn svg { width:14px; height:14px; flex-shrink:0; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
        .nav-badge { margin-left:auto; background:rgba(197,160,40,0.15); color:var(--gold); border:1px solid rgba(197,160,40,0.3); font-size:.62rem; padding:.1rem .4rem; border-radius:10px; font-family:'Cinzel',serif; }
        .nav-badge.red { background:rgba(139,0,0,0.3); color:#FF8080; border-color:rgba(139,0,0,0.5); }

        /* ── CARDS / TABLES / FORMS ── */
        .page-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:1.5rem; padding-bottom:1rem; border-bottom:1px solid var(--border); }
        .page-title { font-family:'Cinzel',serif; font-size:1.2rem; font-weight:600; letter-spacing:.08em; }
        .page-sub { font-size:.8rem; color:var(--muted); margin-top:.2rem; }
        .page-actions { display:flex; gap:.5rem; }
        .card { background:var(--navy); border:1px solid var(--border); border-radius:6px; padding:1.25rem; margin-bottom:1rem; }
        .card-hdr { display:flex; align-items:center; justify-content:space-between; margin-bottom:1rem; padding-bottom:.75rem; border-bottom:1px solid var(--border); }
        .card-title { font-family:'Cinzel',serif; font-size:.8rem; font-weight:600; color:var(--gold); letter-spacing:.06em; text-transform:uppercase; }
        .stats-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:1rem; margin-bottom:1.5rem; }
        .stat-card { background:var(--navy); border:1px solid var(--border); border-radius:6px; padding:1.25rem; position:relative; overflow:hidden; }
        .stat-card::before { content:''; position:absolute; top:0;left:0;right:0; height:2px; background:linear-gradient(90deg,var(--crimson),var(--gold)); }
        .stat-label { font-size:.68rem; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); font-family:'Cinzel',serif; margin-bottom:.4rem; }
        .stat-val { font-family:'Cinzel',serif; font-size:1.8rem; font-weight:700; color:var(--gold); line-height:1; }
        .stat-sub { font-size:.73rem; color:var(--muted); margin-top:.35rem; }
        .btn { display:inline-flex; align-items:center; gap:.4rem; padding:.42rem 1rem; border-radius:4px; font-family:'Cinzel',serif; font-size:.72rem; font-weight:600; letter-spacing:.05em; cursor:pointer; border:1px solid; transition:all .15s; text-transform:uppercase; }
        .btn svg { width:13px; height:13px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
        .btn-primary { background:linear-gradient(135deg,var(--crimson),#4a0000); border-color:rgba(197,160,40,.4); color:var(--gold); }
        .btn-primary:hover { background:linear-gradient(135deg,#7a0000,var(--crimson)); border-color:var(--gold); box-shadow:0 2px 12px rgba(92,10,10,.5); }
        .btn-secondary { background:rgba(255,255,255,.04); border-color:var(--border); color:var(--text2); }
        .btn-secondary:hover { border-color:var(--border-h); color:var(--text); }
        .btn-gold { background:rgba(197,160,40,.12); border-color:rgba(197,160,40,.4); color:var(--gold); }
        .btn-gold:hover { background:rgba(197,160,40,.22); border-color:var(--gold); }
        .btn-sm { padding:.28rem .65rem; font-size:.67rem; }
        .btn-icon { padding:.32rem; width:28px; height:28px; justify-content:center; }
        table { width:100%; border-collapse:collapse; font-size:.87rem; }
        th { text-align:left; padding:.55rem .75rem; font-family:'Cinzel',serif; font-size:.65rem; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); border-bottom:1px solid var(--border); }
        td { padding:.65rem .75rem; border-bottom:1px solid rgba(197,160,40,.07); vertical-align:middle; }
        tr:last-child td { border-bottom:none; }
        tr:hover td { background:rgba(197,160,40,.03); }
        .td-p { font-weight:600; color:var(--text); }
        .td-s { font-size:.77rem; color:var(--muted); margin-top:.12rem; }
        .badge { display:inline-flex; align-items:center; padding:.18rem .5rem; border-radius:3px; font-size:.66rem; font-family:'Cinzel',serif; letter-spacing:.06em; font-weight:600; text-transform:uppercase; white-space:nowrap; }
        .b-gold { background:rgba(197,160,40,.15); color:var(--gold); border:1px solid rgba(197,160,40,.3); }
        .b-red { background:rgba(139,0,0,.3); color:#FF8080; border:1px solid rgba(139,0,0,.5); }
        .b-green { background:rgba(34,197,94,.1); color:#4ADE80; border:1px solid rgba(34,197,94,.25); }
        .b-blue { background:rgba(37,99,235,.15); color:#93C5FD; border:1px solid rgba(37,99,235,.3); }
        .b-muted { background:rgba(255,255,255,.05); color:var(--muted); border:1px solid rgba(255,255,255,.08); }
        .b-orange { background:rgba(234,88,12,.15); color:#FB923C; border:1px solid rgba(234,88,12,.3); }
        .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.78); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; z-index:1000; padding:1rem; }
        .modal { background:var(--navy); border:1px solid var(--border); border-radius:8px; padding:1.75rem; width:100%; max-width:680px; max-height:90vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,.6); }
        .modal-lg { max-width:900px; }
        .modal-hdr { display:flex; align-items:center; justify-content:space-between; margin-bottom:1.5rem; padding-bottom:1rem; border-bottom:1px solid var(--border); }
        .modal-title { font-family:'Cinzel',serif; font-size:1rem; font-weight:600; color:var(--gold); letter-spacing:.06em; }
        .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:1rem; margin-bottom:1rem; }
        .form-group { display:flex; flex-direction:column; gap:.3rem; }
        .form-group.full { grid-column:1/-1; }
        label { font-size:.68rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-family:'Cinzel',serif; }
        input,select,textarea { background:var(--navy-light); border:1px solid var(--border); color:var(--text); padding:.48rem .7rem; border-radius:4px; font-family:'Crimson Pro',serif; font-size:.9rem; transition:border-color .15s; width:100%; }
        input:focus,select:focus,textarea:focus { outline:none; border-color:rgba(197,160,40,.5); box-shadow:0 0 0 2px rgba(197,160,40,.08); }
        select option { background:var(--navy-mid); }
        textarea { resize:vertical; min-height:75px; }
        .form-actions { display:flex; gap:.75rem; padding-top:1.25rem; border-top:1px solid var(--border); margin-top:1rem; justify-content:flex-end; }
        .empty-state { text-align:center; padding:3rem; color:var(--muted); }
        .empty-state svg { width:44px; height:44px; opacity:.2; margin-bottom:1rem; fill:none; stroke:currentColor; stroke-width:1.5; }
        .two-col { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
        .auto-banner { display:flex; align-items:center; gap:.7rem; padding:.6rem 1rem; background:rgba(34,197,94,.07); border:1px solid rgba(34,197,94,.2); border-radius:4px; font-size:.82rem; color:#4ADE80; margin-bottom:1rem; }
        .auto-banner svg { width:14px; height:14px; flex-shrink:0; fill:none; stroke:currentColor; stroke-width:2; }
        .alert { display:flex; align-items:flex-start; gap:.7rem; padding:.8rem 1rem; border-radius:4px; font-size:.85rem; margin-bottom:1rem; }
        .alert svg { width:15px; height:15px; flex-shrink:0; fill:none; stroke:currentColor; stroke-width:2; margin-top:1px; }
        .alert-info { background:rgba(37,99,235,.1); border:1px solid rgba(37,99,235,.25); color:#93C5FD; }
        .alert-warn { background:rgba(197,160,40,.1); border:1px solid rgba(197,160,40,.25); color:var(--gold); }
        .progress-bar { height:4px; background:var(--navy-light); border-radius:2px; overflow:hidden; }
        .progress-fill { height:100%; background:linear-gradient(90deg,var(--crimson),var(--gold)); transition:width .3s; }
        .spinner { width:18px; height:18px; border:2px solid var(--border); border-top-color:var(--gold); border-radius:50%; animation:spin .8s linear infinite; }
        @keyframes spin { to { transform:rotate(360deg); } }
        .divider { height:1px; background:var(--border); margin:1.25rem 0; }
        .countdown-red { color:#FF6B6B; font-weight:700; }
        .countdown-yellow { color:var(--gold); font-weight:600; }
        .countdown-green { color:#4ADE80; }
        .countdown-muted { color:var(--muted); }
        .upload-zone { border:2px dashed var(--border); border-radius:6px; padding:2.5rem; text-align:center; cursor:pointer; transition:all .2s; }
        .upload-zone:hover { border-color:var(--gold); background:rgba(197,160,40,.04); }
        .upload-zone p { color:var(--muted); font-size:.88rem; }
        .upload-zone strong { color:var(--gold); }
        ::-webkit-scrollbar { width:5px; }
        ::-webkit-scrollbar-track { background:var(--navy); }
        ::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }

        /* ── CAP STATEMENT ── */
        .cap-wrap { background:#fff; color:#1a1a1a; font-family:Arial,sans-serif; font-size:10pt; border-radius:4px; overflow:hidden; max-width:800px; }
        .cap-banner { background:linear-gradient(135deg,#5C0A0A,#3a0505); display:flex; align-items:center; justify-content:space-between; padding:14px 20px; gap:16px; }
        .cap-logo-area { display:flex; align-items:center; gap:10px; }
        .cap-logo-area img { height:60px; width:auto; }
        .cap-founder { display:flex; align-items:center; gap:10px; }
        .cap-headshot { width:52px; height:52px; border-radius:50%; border:2px solid #C5A028; object-fit:cover; object-position:top; }
        .cap-founder-info { text-align:right; }
        .cap-fname { font-family:Helvetica,Arial,sans-serif; font-size:10pt; font-weight:700; color:#C5A028; }
        .cap-ftitle { font-size:8pt; color:#aaa; margin-top:1px; }
        .cap-fcerts { font-size:7pt; color:#C5A028; margin-top:3px; letter-spacing:.04em; }
        .cap-sub-bar { background:#1a0505; padding:7px 20px; display:flex; align-items:center; justify-content:space-between; border-bottom:1.5px solid #C5A028; }
        .cap-sub-title { font-family:Helvetica,Arial,sans-serif; font-size:10pt; font-weight:700; color:#C5A028; letter-spacing:.06em; }
        .cap-sub-pills { display:flex; gap:6px; }
        .cap-pill { font-size:7pt; border:1px solid rgba(197,160,40,.4); background:rgba(197,160,40,.12); color:#C5A028; padding:1px 8px; border-radius:10px; font-weight:700; }
        .cap-body { display:grid; grid-template-columns:1fr 1fr 1fr; gap:0; }
        .cap-col { padding:14px 16px; border-right:1px solid #e8e0d0; }
        .cap-col:last-child { border-right:none; }
        .cap-col-title { font-size:7.5pt; font-weight:700; text-transform:uppercase; letter-spacing:.1em; color:#5C0A0A; border-bottom:1.5px solid #C5A028; padding-bottom:3px; margin-bottom:9px; }
        .cap-item { display:flex; gap:5px; margin-bottom:5px; font-size:8.5pt; line-height:1.45; }
        .cap-bullet { color:#C5A028; flex-shrink:0; margin-top:1px; }
        .cap-info-row { display:flex; gap:4px; margin-bottom:4px; font-size:8pt; }
        .cap-info-label { color:#5C0A0A; font-weight:700; min-width:40px; flex-shrink:0; }
        .cap-info-val { color:#333; }
        .cap-coin-wrap { text-align:center; margin:10px 0; }
        .cap-coin-wrap img { width:90px; height:90px; }
        .cap-footer { background:#1a0505; padding:9px 20px; display:flex; justify-content:space-between; align-items:center; }
        .cap-footer-l { font-size:8pt; color:#C5A028; font-weight:700; }
        .cap-footer-r { font-size:7pt; color:#888; }

        /* ── SOLICITATION RESPONSE ── */
        .sol-dropzone { border:2px dashed rgba(197,160,40,.35); border-radius:8px; padding:3rem; text-align:center; cursor:pointer; transition:all .2s; background:rgba(197,160,40,.02); }
        .sol-dropzone:hover,.sol-dropzone.drag { border-color:var(--gold); background:rgba(197,160,40,.06); }
        .sol-req-item { background:var(--navy-light); border:1px solid var(--border); border-radius:5px; padding:.85rem 1rem; margin-bottom:.6rem; }
        .sol-req-num { font-family:'Cinzel',serif; font-size:.72rem; color:var(--gold); letter-spacing:.06em; margin-bottom:.3rem; }
        .sol-req-text { font-size:.85rem; color:var(--text2); line-height:1.5; }
        .sol-response-box { margin-top:.5rem; }
        .sol-response-box textarea { min-height:100px; }

        @media print {
            .no-print { display:none !important; }
        }
    </style>
</head>

<div id="root"></div>

const fmt$ = n => "$"+(parseFloat(n)||0).toLocaleString("en-US",{maximumFractionDigits:0});
const fmtDate = d => d?new Date(d+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}):"—";
const uid = p => `${p}_${Date.now()}_${Math.random().toString(36).slice(2,7)}`;
const daysUntil = ds => { if(!ds)return null; const t=new Date(ds+"T12:00:00"),n=new Date(); n.setHours(12,0,0,0); return Math.ceil((t-n)/86400000); };
const cdClass = d => { if(d===null)return"countdown-muted"; if(d<0)return"countdown-red"; if(d<=6)return"countdown-red"; if(d<=13)return"countdown-yellow"; return"countdown-green"; };
const sbadge = s => ({Active:"b-green",Won:"b-green",Submitted:"b-blue","Writing Proposal":"b-orange","Under Evaluation":"b-blue",Lost:"b-red","No Bid":"b-muted",Terminated:"b-red",Pending:"b-muted",Reviewing:"b-gold",Identified:"b-gold",Draft:"b-muted",Sent:"b-blue",Paid:"b-green",Overdue:"b-red",Open:"b-green",Filled:"b-blue",Closed:"b-muted",Screening:"b-orange",Interviewing:"b-blue",Placed:"b-green"}[s]||"b-muted");

const API = {
    async get(e){try{const r=await fetch(`/api/${e}`);if(!r.ok)throw new Error();return r.json();}catch{return JSON.parse(localStorage.getItem("imp_"+e)||"[]");}},
    async post(e,d){try{await fetch(`/api/${e}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)});}catch{}const key="imp_"+e.replace("save-","")+"s";const cur=JSON.parse(localStorage.getItem(key)||"[]");const up=cur.some(x=>x.id===d.id)?cur.map(x=>x.id===d.id?d:x):[...cur,d];localStorage.setItem(key,JSON.stringify(up));},
    async del(e,id){try{await fetch(`/api/${e}`,{method:"DELETE",headers:{"Content-Type":"application/json"},body:JSON.stringify({id})});}catch{}},
};

// ── SOLICITATION RESPONSE (drop SOW → respond) ──
const SolicitationResponse = ({clients,bids}) => {
    const [file,setFile] = useState(null);
    const [dragging,setDragging] = useState(false);
    const [parsed,setParsed] = useState(null);
    const [responses,setResponses] = useState({});
    const [linkedBid,setLinkedBid] = useState("");
    const [processing,setProcessing] = useState(false);
    const fileRef = useRef(null);

    const handleDrop = e => {
        e.preventDefault(); setDragging(false);
        const f = e.dataTransfer.files[0];
        if(f) loadFile(f);
    };

    const loadFile = f => {
        setFile(f); setProcessing(true);
        setTimeout(()=>{
            const bid = linkedBid ? bids.find(b=>b.id===linkedBid) : null;
            setParsed({
                solNum: bid?.solicitationNumber || "SOL-"+Math.floor(10000+Math.random()*90000),
                agency: bid?.agencyName || f.name.split(".")[0].replace(/_/g," "),
                title: bid?.title || "Professional Services — See attached SOW",
                dueDate: bid?.dueDate || "",
                type: f.name.toLowerCase().includes("rfq")?"RFQ":f.name.toLowerCase().includes("rfp")?"RFP":"Sources Sought",
                requirements:[
                    {id:"R1",section:"Section C — Scope",text:"Contractor shall provide qualified personnel to fill positions as defined in the Performance Work Statement. All personnel must meet minimum qualifications stated in Attachment 1."},
                    {id:"R2",section:"Section C — Clearances",text:"Personnel performing work under this contract must possess and maintain the security clearance level specified for their position. Contractor shall verify clearances prior to assignment."},
                    {id:"R3",section:"Section C — Staffing",text:"Contractor shall provide a staffing plan demonstrating ability to fill positions within 30 days of task order award. Key personnel must be identified by name."},
                    {id:"R4",section:"Section L — Technical",text:"Offerors shall submit a Technical Approach not to exceed 10 pages demonstrating understanding of the requirement and proposed methodology."},
                    {id:"R5",section:"Section L — Past Performance",text:"Offerors shall submit up to 3 references for recent, relevant contracts of similar scope, value, and complexity performed within the past 5 years."},
                    {id:"R6",section:"Section M — Evaluation",text:"Technical approach will be evaluated on: (1) Understanding of requirement, (2) Staffing approach, (3) Quality control plan, (4) Transition plan."},
                ]
            });
            setProcessing(false);
        },1600);
    };

    const setResp = (id,val) => setResponses(r=>({...r,[id]:val}));
    const bid = linkedBid ? bids.find(b=>b.id===linkedBid) : null;

    const autoFill = (req) => {
        const templates = {
            "R1":`Imperio Talent Solutions will provide fully qualified personnel meeting all requirements outlined in the PWS. Our rigorous sourcing process includes skills verification, background screening, and compliance checks prior to submission. We maintain an active pipeline of cleared and credentialed candidates across all required verticals. ${bid?"This directly aligns with our work on "+bid.agencyName+".":""}`,
            "R2":`All Imperial personnel hold or are eligible for the required clearance levels. Our Founder, Anthony K. Kelley Sr., holds an active Secret clearance through 2030 and brings 21 years of classified environment experience. We verify clearance status via JPAS/DISS prior to any assignment and maintain continuous monitoring throughout the period of performance.`,
            "R3":`Imperio's staffing plan leverages our established partnerships with VSchool.io, CyberTex Institute, Sabio.la, and VetSec to rapidly source candidates. We maintain a pre-screened candidate pipeline enabling 30-day placement fulfillment. Key Personnel: Anthony K. Kelley Sr. (Program Manager / POC), supported by qualified placement specialists per vertical.`,
            "R4":`Technical Approach: Imperio Talent Solutions understands that mission success depends on placing the right person, in the right role, at the right time. Our approach: (1) Requirement Analysis — we map PWS requirements to specific NAICS codes and skill profiles; (2) Candidate Sourcing — multi-channel sourcing including veteran networks, cleared job boards, and direct outreach; (3) Vetting — skills assessments, reference checks, clearance verification; (4) Placement — 30-day fulfillment SLA with replacement guarantee. NAICS: ${CO.naics.slice(0,4).join(", ")}. CAGE: ${CO.cage}. UEI: ${CO.uei}.`,
            "R5":`Past Performance References: (1) U.S. Army / Fort Cavazos — 21-year logistics and procurement support, managing $1.5B+ in equipment accountability, S4 NCOIC. Clearance: Secret. Contact available upon request. (2) Veteran-focused staffing through CyberTex Institute partnership — IT and cybersecurity placement program. (3) Supply chain procurement support through D&H, Ingram Micro, and TD SYNNEX distributor relationships. SDVOSB status verified — SAM.gov active.`,
            "R6":`Imperio's technical evaluation response: (1) Understanding — we have reviewed the full SOW and confirm capability to meet all PWS requirements; (2) Staffing approach — founder-led execution, single POC accountability, pre-screened pipeline; (3) Quality control — milestone check-ins, replacement guarantee within 15 business days if placement does not meet standards; (4) Transition — phased onboarding, incumbent interview process, 30-day parallel support.`,
        };
        setResp(req.id, templates[req.id] || `Imperio Talent Solutions has reviewed ${req.section} and confirms full capability to meet this requirement. Our SDVOSB status (CAGE: ${CO.cage}, UEI: ${CO.uei}) and ${CO.clearance} position us to deliver compliant, mission-ready performance.`);
    };

    return (
        <div>
            <div className="page-header">
                <div>
                    <div className="page-title">Solicitation Response</div>
                    <div className="page-sub">Drop the government-issued SOW/PWS → respond section by section</div>
                </div>
                {parsed && (
                    <div className="page-actions">
                        <button className="btn btn-secondary btn-sm" onClick={()=>window.print()}><Ico.Print sz={13}/>Print Response</button>

                    </div>

                    <div
                        className={`sol-dropzone ${dragging?"drag":""}`}
                        onDragOver={e=>{e.preventDefault();setDragging(true);}}

                        onDrop={handleDrop}

// ── DASHBOARD ──
const Dashboard = ({clients,bids,setMod}) => {
    const active = clients.filter(c=>c.status==="Active").length;
    const activeBids = bids.filter(b=>!["Won","Lost","No Bid"].includes(b.status)).length;
    const pipeline = bids.filter(b=>!["Won","Lost","No Bid"].includes(b.status)).reduce((s,b)=>s+(parseFloat(b.estimatedValue)||0),0);
    const won = bids.filter(b=>b.status==="Won").reduce((s,b)=>s+(parseFloat(b.estimatedValue)||0),0);
    const urgent = bids.filter(b=>{const d=daysUntil(b.dueDate);return d!==null&&d>=0&&d<=7&&!["Won","Lost","No Bid"].includes(b.status);});
    const wonNoClient = bids.filter(b=>b.status==="Won").filter(b=>!clients.some(c=>c.sourceContractId===b.id));

    return (
        <div>
            <div className="page-header">
                <div><div className="page-title">Operations Dashboard</div><div className="page-sub">{CO.name} · {new Date().toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"})}</div></div>
            </div>
            <div className="stats-grid">
                {[{l:"Active Clients",v:active,s:`${clients.length} total`},{l:"Active Bids",v:activeBids,s:urgent.length?`${urgent.length} urgent`:"No urgent deadlines"},{l:"Pipeline",v:fmt$(pipeline),s:"Active bids"},{l:"Won Contracts",v:fmt$(won),s:`${bids.filter(b=>b.status==="Won").length} awards`}].map(x=>(
                    <div key={x.l} className="stat-card"><div className="stat-label">{x.l}</div><div className="stat-val" style={{fontSize:x.l.includes("$")||x.v>999?"1.3rem":"1.8rem"}}>{x.v}</div><div className="stat-sub">{x.s}</div></div>
                ))}
            </div>
            <div className="two-col">
                <div className="card">
                    <div className="card-hdr"><div className="card-title">Urgent Deadlines</div><button className="btn btn-secondary btn-sm" onClick={()=>setMod("bids")}><Ico.ChevR sz={13}/>All Bids</button></div>
                    {urgent.length===0?<div style={{color:"var(--muted)",fontSize:"0.85rem",padding:"1rem",textAlign:"center"}}>No bids due within 7 days</div>:
                    urgent.map(b=>{const d=daysUntil(b.dueDate);return(
                        <div key={b.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"0.6rem 0",borderBottom:"1px solid rgba(197,160,40,0.08)"}}>
                            <div><div style={{fontWeight:600,fontSize:"0.88rem"}}>{b.agencyName}</div><div className="td-s">{b.solicitationNumber}</div></div>
                            <span className={`${cdClass(d)}`} style={{fontFamily:"Cinzel,serif",fontWeight:700}}>{d===0?"TODAY":`${d}d`}</span>
                        </div>
                    );})}
                </div>
                <div className="card">
                    <div className="card-hdr"><div className="card-title">Action Items</div></div>
                    {wonNoClient.length>0&&<div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"0.5rem 0.75rem",background:"rgba(197,160,40,0.08)",borderRadius:4,border:"1px solid rgba(197,160,40,0.18)",marginBottom:"0.5rem"}}>
                        <span style={{fontSize:"0.83rem"}}>⚡ <strong className="countdown-yellow">{wonNoClient.length} Won Bid{wonNoClient.length>1?"s":""}</strong> <span style={{color:"var(--muted)"}}>need client records</span></span>
                        <button className="btn btn-gold btn-sm" onClick={()=>setMod("clients")}>Create</button>
                    </div>}
                    {urgent.length>0&&<div style={{padding:"0.5rem 0.75rem",background:"rgba(139,0,0,0.1)",borderRadius:4,border:"1px solid rgba(139,0,0,0.25)",marginBottom:"0.5rem",fontSize:"0.83rem"}}>
                        <span className="countdown-red">⚠ {urgent.length} bid{urgent.length>1?"s":""} due within 7 days</span>
                    </div>}
                    <div style={{padding:"0.5rem 0.75rem",background:"rgba(37,99,235,0.06)",borderRadius:4,border:"1px solid rgba(37,99,235,0.12)",fontSize:"0.83rem",color:"var(--text2)"}}>
                        Cap Statement updated: <strong style={{color:"var(--text)"}}>{active} clients</strong> · <strong style={{color:"var(--text)"}}>{bids.filter(b=>b.status==="Won").length} wins</strong> · <button className="btn btn-secondary btn-sm" style={{marginLeft:"0.5rem"}} onClick={()=>setMod("capstatement")}>Open</button>
                    </div>
                </div>
            </div>
        </div>
    );
};

// ── MAIN APP ──
const App = () => {
    const [mod,setMod] = useState("dashboard");
    const [clients,setClients] = useState([]);
    const [bids,setBids] = useState([]);
    const [loading,setLoading] = useState(true);

    useEffect(()=>{ loadData(); },[]);

    const loadData = async () => {
        setLoading(true);
        const [c,b] = await Promise.all([API.get("get-clients"),API.get("get-bids")]);
        setClients(c); setBids(b); setLoading(false);
    };

    const saveClient = async d => { await API.post("save-client",d); await loadData(); };
    const delClient = async id => { if(!confirm("Delete client?"))return; await API.del("delete-client",id); await loadData(); };
    const saveBid = async d => { await API.post("save-bid",d); await loadData(); };
    const delBid = async id => { if(!confirm("Delete bid?"))return; await API.del("delete-bid",id); await loadData(); };

    const nav = [
        {s:"Operations",items:[
            {id:"dashboard",i:Ico.Home,l:"Dashboard"},
            {id:"clients",i:Ico.Bldg,l:"Clients",badge:()=>clients.filter(c=>c.status==="Active").length},
            {id:"bids",i:Ico.Target,l:"Bid Tracker",badge:()=>bids.filter(b=>!["Won","Lost","No Bid"].includes(b.status)).length},
            {id:"requisitions",i:Ico.File,l:"Requisitions"},
            {id:"candidates",i:Ico.Users,l:"Candidates"},
        ]},
        {s:"Finance",items:[
            {id:"revenue",i:Ico.Dollar,l:"Revenue"},
            {id:"invoicing",i:Ico.FCheck,l:"Invoicing"},
            {id:"supply",i:Ico.Pkg,l:"Supply & PO"},
            {id:"eor",i:Ico.UCheck,l:"EOR Workforce"},
        ]},
        {s:"Business Dev",items:[
            {id:"capstatement",i:Ico.Award,l:"Cap Statement"},
            {id:"solicitation",i:Ico.FSig,l:"Solicitation Response"},
            {id:"compliance",i:Ico.Shield,l:"Compliance"},
        ]},
    ];

    if(loading) return (
        <div>
            <Header/>
            <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"calc(100vh - 90px)",gap:"0.75rem",color:"var(--muted)"}}>
                <div className="spinner" style={{width:24,height:24}}/>
                <span style={{fontFamily:"Cinzel,serif",letterSpacing:"0.1em"}}>Loading from cloud...</span>
            </div>
        </div>
    );

    return (
        <div>
            <Header/>
            <div className="app">
                <aside className="sidebar">
                    {nav.map(section=>(
                        <div key={section.s}>
                            <div className="sidebar-section">{section.s}</div>
                            {section.items.map(({id,i:Icon,l,badge})=>{
                                const cnt = badge?badge():0;
                                return (
                                    <button key={id} className={`nav-btn ${mod===id?"active":""}`} onClick={()=>setMod(id)}>
                                        <Icon sz={14}/>
                                        <span>{l}</span>
                                        {cnt>0&&<span className={`nav-badge ${id==="bids"&&bids.some(b=>{const d=daysUntil(b.dueDate);return d!==null&&d<=7&&!["Won","Lost","No Bid"].includes(b.status);})?"red":""}`}>{cnt}</span>}
                                    </button>
                                );
                            })}
                        </div>
                    ))}
                </aside>
                <main className="main">
                    {mod==="dashboard"&&<Dashboard clients={clients} bids={bids} setMod={setMod}/>}
                    {mod==="clients"&&<ClientMod clients={clients} bids={bids} onSave={saveClient} onDelete={delClient}/>}
                    {mod==="bids"&&<BidMod bids={bids} onSave={saveBid} onDelete={delBid}/>}
                    {mod==="capstatement"&&<CapStatement clients={clients} bids={bids}/>}
                    {mod==="solicitation"&&<SolicitationResponse clients={clients} bids={bids}/>}
                    {["requisitions","candidates","revenue","invoicing","supply","eor","compliance"].includes(mod)&&<PlaceholderMod title={nav.flatMap(s=>s.items).find(x=>x.id===mod)?.l||mod}/>}
                </main>
            </div>
        </div>
    );
};

ReactDOM.render(<App/>,document.getElementById("root"));
</script>
</body>
</html>
