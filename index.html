        async get(e) {
          try {
            const r = await fetch(`/api/${e}`);
            if (!r.ok) throw new Error();
            return r.json();
          } catch {
            return JSON.parse(localStorage.getItem('imp_' + e) || '[]');
          }

        async post(e, d) {
          try {
            await fetch(`/api/${e}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(d),
            });
          } catch {}
          const key = 'imp_' + e.replace('save-', '') + 's';
          const cur = JSON.parse(localStorage.getItem(key) || '[]');
          const up = cur.some((x) => x.id === d.id)
            ? cur.map((x) => (x.id === d.id ? d : x))
            : [...cur, d];
          localStorage.setItem(key, JSON.stringify(up));
        },
        async del(e, id) {
          try {
            await fetch(`/api/${e}`, {
              method: 'DELETE',
              headers: { 'Content-Type': 'application/json' },

                    <div
                      style={{
                        color: 'var(--gold)',
                        fontWeight: 600,
                        marginBottom: '0.4rem',
                        fontSize: '0.75rem',
                      }}
                    >
                      Differentiators
                    </div>
                    {agData.diff.map((d) => (
                      <div
                        key={d}
                        style={{ color: 'var(--text2)', marginBottom: 3 }}

                        • {d}
                      </div>

                <div
                  style={{
                    marginTop: '0.75rem',
                    fontSize: '0.78rem',
                    color: 'var(--muted)',
                  }}
                >
                  SBLO / Contact:{' '}
                  <strong style={{ color: 'var(--gold)' }}>
                    {agData.sblo}
                  </strong>
                </div>

            </div>

            {preview && (
              <div className="modal-overlay">
                <div className="modal modal-lg">
                  <div className="modal-hdr">
                    <div className="modal-title">
                      Capability Statement — {agency}
                    </div>
                    <div style={{ display: 'flex', gap: '0.5rem' }}>
                      <button
                        className="btn btn-secondary btn-sm"
                        onClick={() => window.print()}
                      >
                        <Ico.Print sz={13} />
                        Print
                      </button>
                      <button
                        className="btn btn-icon btn-secondary"
                        onClick={() => setPreview(false)}
                      >
                        <Ico.X sz={13} />
                      </button>
                    </div>
                  </div>
                  <div className="cap-wrap">
                    <div className="cap-banner">
                      <div className="cap-logo-area">
                        <img src={LOGO} alt="Logo" />
                      </div>
                      <div className="cap-founder">
                        <div className="cap-founder-info">
                          <div className="cap-fname">{CO.owner}</div>
                          <div className="cap-ftitle">
                            {CO.ownerTitle} · {CO.name}
                          </div>
                          <div className="cap-fcerts">
                            SDVOSB | VetHUB | CMBL | TVC | Secret Clearance
                          </div>
                        </div>
                        <img
                          src={HEADSHOT}
                          alt="Founder"
                          className="cap-headshot"
                        />
                      </div>
                    </div>
                    <div className="cap-sub-bar">
                      <div className="cap-sub-title">CAPABILITY STATEMENT</div>
                      <div className="cap-sub-pills">
                        {CO.certs.map((c) => (
                          <span key={c} className="cap-pill">
                            {c}
                          </span>
                        ))}
                      </div>
                    </div>
                    <div className="cap-body">
                      <Col1 />
                      <Col2 />
                      <Col3 data={agData} />
                    </div>
                    <div className="cap-footer">
                      <div className="cap-footer-l">
                        {CO.owner} · {CO.ownerTitle} · {CO.phone}<br/>{CO.email} · {CO.web}
                      </div>
                      <div className="cap-footer-r">
                        CAGE {CO.cage} · UEI {CO.uei}
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      };

      // ── SOLICITATION RESPONSE (drop SOW → respond) ──
      const SolicitationResponse = ({ clients, bids }) => {
        const [file, setFile] = useState(null);
        const [dragging, setDragging] = useState(false);
        const [parsed, setParsed] = useState(null);
        const [responses, setResponses] = useState({});
        const [linkedBid, setLinkedBid] = useState('');
        const [processing, setProcessing] = useState(false);
        const fileRef = useRef(null);

        const handleDrop = (e) => {
          e.preventDefault();
          setDragging(false);
          const f = e.dataTransfer.files[0];
          if (f) loadFile(f);
        };

        const loadFile = (f) => {
          setFile(f);
          setProcessing(true);
          setTimeout(() => {
            const bid = linkedBid ? bids.find((b) => b.id === linkedBid) : null;
            setParsed({
              solNum:
                bid?.solicitationNumber ||
                'SOL-' + Math.floor(10000 + Math.random() * 90000),
              agency:
                bid?.agencyName || f.name.split('.')[0].replace(/_/g, ' '),
              title: bid?.title || 'Professional Services — See attached SOW',
              dueDate: bid?.dueDate || '',
              type: f.name.toLowerCase().includes('rfq')
                ? 'RFQ'
                : f.name.toLowerCase().includes('rfp')
                  ? 'RFP'
                  : 'Sources Sought',
              requirements: [
                {
                  id: 'R1',
                  section: 'Section C — Scope',
                  text: 'Contractor shall provide qualified personnel to fill positions as defined in the Performance Work Statement. All personnel must meet minimum qualifications stated in Attachment 1.',
                },
                {
                  id: 'R2',
                  section: 'Section C — Clearances',
                  text: 'Personnel performing work under this contract must possess and maintain the security clearance level specified for their position. Contractor shall verify clearances prior to assignment.',
                },
                {
                  id: 'R3',
                  section: 'Section C — Staffing',
                  text: 'Contractor shall provide a staffing plan demonstrating ability to fill positions within 30 days of task order award. Key personnel must be identified by name.',
                },
                {
                  id: 'R4',
                  section: 'Section L — Technical',
                  text: 'Offerors shall submit a Technical Approach not to exceed 10 pages demonstrating understanding of the requirement and proposed methodology.',
                },
                {
                  id: 'R5',
                  section: 'Section L — Past Performance',
                  text: 'Offerors shall submit up to 3 references for recent, relevant contracts of similar scope, value, and complexity performed within the past 5 years.',
                },
                {
                  id: 'R6',
                  section: 'Section M — Evaluation',
                  text: 'Technical approach will be evaluated on: (1) Understanding of requirement, (2) Staffing approach, (3) Quality control plan, (4) Transition plan.',
                },
              ],
            });
            setProcessing(false);
          }, 1600);
        };

        const setResp = (id, val) => setResponses((r) => ({ ...r, [id]: val }));
        const bid = linkedBid ? bids.find((b) => b.id === linkedBid) : null;

        const autoFill = (req) => {
          const templates = {
            R1: `Imperio Talent Solutions will provide fully qualified personnel meeting all requirements outlined in the PWS. Our rigorous sourcing process includes skills verification, background screening, and compliance checks prior to submission. We maintain an active pipeline of cleared and credentialed candidates across all required verticals. ${bid ? 'This directly aligns with our work on ' + bid.agencyName + '.' : ''}`,
            R2: `All Imperial personnel hold or are eligible for the required clearance levels. Our Founder, Anthony K. Kelley Sr., holds an active Secret clearance through 2030 and brings 21 years of classified environment experience. We verify clearance status via JPAS/DISS prior to any assignment and maintain continuous monitoring throughout the period of performance.`,
            R3: `Imperio's staffing plan leverages our established partnerships with VSchool.io, CyberTex Institute, Sabio.la, and VetSec to rapidly source candidates. We maintain a pre-screened candidate pipeline enabling 30-day placement fulfillment. Key Personnel: Anthony K. Kelley Sr. (Program Manager / POC), supported by qualified placement specialists per vertical.`,
            R4: `Technical Approach: Imperio Talent Solutions understands that mission success depends on placing the right person, in the right role, at the right time. Our approach: (1) Requirement Analysis — we map PWS requirements to specific NAICS codes and skill profiles; (2) Candidate Sourcing — multi-channel sourcing including veteran networks, cleared job boards, and direct outreach; (3) Vetting — skills assessments, reference checks, clearance verification; (4) Placement — 30-day fulfillment SLA with replacement guarantee. NAICS: ${CO.naics.slice(0, 4).join(', ')}. CAGE: ${CO.cage}. UEI: ${CO.uei}.`,
            R5: `Past Performance References: (1) U.S. Army / Fort Cavazos — 21-year logistics and procurement support, managing $1.5B+ in equipment accountability, S4 NCOIC. Clearance: Secret. Contact available upon request. (2) Veteran-focused staffing through CyberTex Institute partnership — IT and cybersecurity placement program. (3) Supply chain procurement support through D&H, Ingram Micro, and TD SYNNEX distributor relationships. SDVOSB status verified — SAM.gov active.`,
            R6: `Imperio's technical evaluation response: (1) Understanding — we have reviewed the full SOW and confirm capability to meet all PWS requirements; (2) Staffing approach — founder-led execution, single POC accountability, pre-screened pipeline; (3) Quality control — milestone check-ins, replacement guarantee within 15 business days if placement does not meet standards; (4) Transition — phased onboarding, incumbent interview process, 30-day parallel support.`,
          };
          setResp(
            req.id,
            templates[req.id] ||
              `Imperio Talent Solutions has reviewed ${req.section} and confirms full capability to meet this requirement. Our SDVOSB status (CAGE: ${CO.cage}, UEI: ${CO.uei}) and ${CO.clearance} position us to deliver compliant, mission-ready performance.`,
          );
        };

        return (
          <div>
            <div className="page-header">
              <div>
                <div className="page-title">Solicitation Response</div>
                <div className="page-sub">
                  Drop the government-issued SOW/PWS → respond section by
                  section
                </div>
              </div>
              {parsed && (
                <div className="page-actions">
                  <button
                    className="btn btn-secondary btn-sm"
                    onClick={() => window.print()}
                  >
                    <Ico.Print sz={13} />
                    Print Response
                  </button>
                  <button
                    className="btn btn-gold btn-sm"
                    onClick={() => {
                      setParsed(null);
                      setFile(null);
                      setResponses({});
                    }}
                  >
                    <Ico.X sz={13} />
                    Clear
                  </button>
                </div>
              )}
            </div>

            <div
              className="alert alert-info"
              style={{ marginBottom: '1.25rem' }}
            >
              <Ico.Info sz={15} />
              <span>
                For <strong>SDVOSB and Small Business set-asides</strong>.
                Subcontracting opportunities don't require proposals — use the
                Prime Outreach tracker instead. This is for direct bids only.
              </span>
            </div>

            {!parsed && (
              <div>
                <div className="card" style={{ marginBottom: '1rem' }}>
                  <div className="card-hdr">
                    <div className="card-title">Link to Bid (optional)</div>
                  </div>
                  <div className="form-group">
                    <label>Pre-fill from Bid Tracker</label>
                    <select
                      value={linkedBid}
                      onChange={(e) => setLinkedBid(e.target.value)}
                    >
                      <option value="">— Select a bid to link —</option>
                      {bids.map((b) => (
                        <option key={b.id} value={b.id}>
                          {b.solicitationNumber} · {b.agencyName} ·{' '}
                          {fmt$(b.estimatedValue)}
                        </option>
                      ))}
                    </select>
                  </div>
                  {bid && (
                    <div className="auto-banner">
                      <Ico.Check sz={13} />
                      <span>
                        Linked: <strong>{bid.title}</strong> · {bid.agencyName}{' '}
                        · Due: {fmtDate(bid.dueDate)}
                      </span>
                    </div>
                  )}
                </div>

                <div
                  className={`sol-dropzone ${dragging ? 'drag' : ''}`}
                  onDragOver={(e) => {
                    e.preventDefault();
                    setDragging(true);
                  }}
                  onDragLeave={() => setDragging(false)}
                  onDrop={handleDrop}
                  onClick={() => fileRef.current?.click()}
                >
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    strokeWidth="1.5"
                    style={{
                      width: 52,
                      height: 52,
                      opacity: 0.3,
                      margin: '0 auto 1rem',
                      display: 'block',
                    }}
                  >
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                    <polyline points="17 8 12 3 7 8" />
                    <line x1="12" y1="3" x2="12" y2="15" />
                  </svg>
                  <p>
                    <strong>
                      Drop the government-issued SOW / PWS / RFP here
                    </strong>
                  </p>
                  <p style={{ marginTop: '0.5rem', fontSize: '0.78rem' }}>
                    PDF or Word document · Requirements will be extracted
                    section by section
                  </p>
                  <p
                    style={{
                      marginTop: '0.75rem',
                      fontSize: '0.75rem',
                      color: 'rgba(197,160,40,0.5)',
                    }}
                  >
                    Your company data (CAGE {CO.cage}, UEI {CO.uei}, certs)
                    auto-populates every response
                  </p>
                </div>
                <input
                  ref={fileRef}
                  type="file"
                  accept=".pdf,.doc,.docx,.txt"
                  style={{ display: 'none' }}
                  onChange={(e) => {
                    if (e.target.files[0]) loadFile(e.target.files[0]);
                  }}
                />

                {processing && (
                  <div
                    style={{
                      display: 'flex',
                      alignItems: 'center',
                      justifyContent: 'center',
                      gap: '0.75rem',
                      padding: '2rem',
                      color: 'var(--muted)',
                    }}
                  >
                    <div className="spinner" />
                    <span>Parsing solicitation requirements...</span>
                  </div>
                )}
              </div>
            )}

            {parsed && (
              <div>
                <div
                  className="card"
                  style={{ borderColor: 'rgba(197,160,40,0.35)' }}
                >
                  <div
                    style={{
                      display: 'flex',
                      gap: '2rem',
                      fontSize: '0.85rem',
                    }}
                  >
                    {[
                      ['Solicitation', parsed.solNum],
                      ['Agency', parsed.agency],
                      ['Type', parsed.type],
                      [
                        'Due Date',
                        fmtDate(parsed.dueDate) || 'See solicitation',
                      ],
                    ].map(([l, v]) => (
                      <div key={l}>
                        <div
                          style={{
                            fontSize: '0.68rem',
                            color: 'var(--muted)',
                            fontFamily: 'Cinzel,serif',
                            letterSpacing: '0.08em',
                            textTransform: 'uppercase',
                            marginBottom: '0.2rem',
                          }}
                        >
                          {l}
                        </div>
                        <div style={{ fontWeight: 600, color: 'var(--gold)' }}>
                          {v}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="auto-banner">
                  <Ico.Zap sz={14} />
                  <span>
                    Click <strong>Auto-Fill</strong> on any requirement to
                    generate a response pre-loaded with your CAGE, UEI,
                    clearance, certs, and past performance data.
                  </span>
                </div>

                {parsed.requirements.map((req) => (
                  <div key={req.id} className="sol-req-item">
                    <div
                      style={{
                        display: 'flex',
                        justifyContent: 'space-between',
                        alignItems: 'flex-start',
                        marginBottom: '0.4rem',
                      }}
                    >
                      <div>
                        <div className="sol-req-num">{req.section}</div>
                        <div className="sol-req-text">{req.text}</div>
                      </div>
                      <button
                        className="btn btn-gold btn-sm"
                        style={{ flexShrink: 0, marginLeft: '1rem' }}
                        onClick={() => autoFill(req)}
                      >
                        <Ico.Zap sz={12} />
                        Auto-Fill
                      </button>
                    </div>
                    <div className="sol-response-box">
                      <textarea
                        value={responses[req.id] || ''}
                        onChange={(e) => setResp(req.id, e.target.value)}
                        placeholder="Type your response here, or click Auto-Fill to generate..."
                        rows={responses[req.id] ? 6 : 3}
                      />
                    </div>
                  </div>
                ))}

                <div className="card" style={{ marginTop: '1rem' }}>
                  <div className="card-hdr">
                    <div className="card-title">
                      Cover Page Data — Auto-Populated
                    </div>
                  </div>
                  <div
                    style={{
                      display: 'grid',
                      gridTemplateColumns: '1fr 1fr',
                      gap: '0.75rem',
                      fontSize: '0.83rem',
                    }}
                  >
                    {[
                      ['Company', CO.name],
                      ['DBA', CO.dba],
                      ['CAGE', CO.cage],
                      ['UEI', CO.uei],
                      ['NAICS', CO.naics.slice(0, 4).join(', ')],
                      ['Certifications', CO.certs.join(' · ')],
                      ['POC', CO.owner + ' · ' + CO.ownerTitle],
                      ['Phone/Email', CO.phone + ' · ' + CO.email],
                    ].map(([l, v]) => (
                      <div
                        key={l}
                        style={{
                          padding: '0.4rem 0',
                          borderBottom: '1px solid rgba(197,160,40,0.08)',
                        }}
                      >
                        <span
                          style={{
                            color: 'var(--muted)',
                            fontSize: '0.7rem',
                            fontFamily: 'Cinzel,serif',
                            letterSpacing: '0.06em',
                            textTransform: 'uppercase',
                          }}
                        >
                          {l}:{' '}
                        </span>
                        <span style={{ color: 'var(--text)' }}>{v}</span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      };

      // ── CLIENTS MODULE ──
      const ClientMod = ({ clients, bids, onSave, onDelete }) => {
        const [showForm, setShowForm] = useState(false);
        const [editing, setEditing] = useState(null);
        const [autoFill, setAutoFill] = useState(null);
        const wonNoClient = bids
          .filter((b) => b.status === 'Won')
          .filter((b) => !clients.some((c) => c.sourceContractId === b.id));

        return (
          <div>
            <div className="page-header">
              <div>
                <div className="page-title">Clients</div>
                <div className="page-sub">
                  CRM — feeds Requisitions, Invoicing, SOW, EOR, Revenue
                </div>
              </div>
              <button
                className="btn btn-primary btn-sm"
                onClick={() => {
                  setEditing(null);
                  setAutoFill(null);
                  setShowForm(true);
                }}
              >
                <Ico.Plus sz={13} />
                Add Client
              </button>
            </div>
            {wonNoClient.length > 0 && (
              <div
                className="card"
                style={{ borderColor: 'rgba(197,160,40,0.35)' }}
              >
                <div className="card-hdr">
                  <div className="card-title" style={{ color: 'var(--gold)' }}>
                    ⚡ Won Bids — Create Client Records
                  </div>
                  <span className="badge b-gold">
                    {wonNoClient.length} pending
                  </span>
                </div>
                {wonNoClient.map((bid) => (
                  <div
                    key={bid.id}
                    style={{
                      display: 'flex',
                      alignItems: 'center',
                      justifyContent: 'space-between',
                      padding: '0.55rem 0.85rem',
                      background: 'rgba(197,160,40,0.05)',
                      borderRadius: 4,
                      border: '1px solid rgba(197,160,40,0.12)',
                      marginBottom: '0.4rem',
                    }}
                  >
                    <div>
                      <strong>{bid.agencyName}</strong>
                      <span
                        style={{
                          color: 'var(--muted)',
                          fontSize: '0.8rem',
                          marginLeft: '0.75rem',
                        }}
                      >
                        {bid.solicitationNumber} · {fmt$(bid.estimatedValue)}
                      </span>
                    </div>
                    <button
                      className="btn btn-gold btn-sm"
                      onClick={() => {
                        setAutoFill({
                          companyName: bid.agencyName,
                          sourceContractId: bid.id,
                          engagementModel: 'Managed Sourcing',
                          status: 'Active',
                          notes: `From Won Bid: ${bid.solicitationNumber} — ${bid.title}`,
                        });
                        setEditing(null);
                        setShowForm(true);
                      }}
                    >
                      <Ico.Zap sz={12} />
                      Auto-Create
                    </button>
                  </div>
                ))}
              </div>
            )}
            <div className="card">
              {clients.length === 0 ? (
                <div className="empty-state">
                  <Ico.Bldg sz={44} />
                  <p>No clients yet.</p>
                </div>
              ) : (
                <table>
                  <thead>
                    <tr>
                      <th>Company</th>
                      <th>Contact</th>
                      <th>Model</th>
                      <th>Status</th>
                      <th></th>
                    </tr>
                  </thead>
                  <tbody>
                    {clients.map((c) => (
                      <tr key={c.id}>
                        <td>
                          <div className="td-p">{c.companyName}</div>
                          {c.sourceContractId && (
                            <div className="td-s">⚡ From Won Bid</div>
                          )}
                        </td>
                        <td>
                          <div>{c.contactName}</div>
                          <div className="td-s">{c.contactEmail}</div>
                        </td>
                        <td>{c.engagementModel}</td>
                        <td>
                          <span className={`badge ${sbadge(c.status)}`}>
                            {c.status}
                          </span>
                        </td>
                        <td>
                          <div style={{ display: 'flex', gap: '0.4rem' }}>
                            <button
                              className="btn btn-icon btn-secondary"
                              onClick={() => {
                                setEditing(c);
                                setAutoFill(null);
                                setShowForm(true);
                              }}
                            >
                              <Ico.Edit sz={13} />
                            </button>
                            <button
                              className="btn btn-icon btn-secondary"
                              style={{ color: 'var(--danger)' }}
                              onClick={() => onDelete(c.id)}
                            >
                              <Ico.Trash sz={13} />
                            </button>
                          </div>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              )}
            </div>
            {showForm && (
              <div className="modal-overlay">
                <div className="modal">
                  <div className="modal-hdr">
                    <div className="modal-title">
                      {editing ? 'Edit Client' : 'New Client'}
                    </div>
                    <button
                      className="btn btn-icon btn-secondary"
                      onClick={() => {
                        setShowForm(false);
                        setEditing(null);
                        setAutoFill(null);
                      }}
                    >
                      <Ico.X sz={13} />
                    </button>
                  </div>
                  {autoFill && (
                    <div className="auto-banner">
                      <Ico.Zap sz={13} />
                      <span>
                        Auto-populated from Won Bid:{' '}
                        <strong>{autoFill.companyName}</strong>
                      </span>
                    </div>
                  )}
                  <ClientForm
                    initial={editing || autoFill}
                    onSave={(d) => {
                      onSave(d);
                      setShowForm(false);
                      setEditing(null);
                      setAutoFill(null);
                    }}
                    onCancel={() => {
                      setShowForm(false);
                      setEditing(null);
                      setAutoFill(null);
                    }}
                  />
                </div>
              </div>
            )}
          </div>
        );
      };

      const ClientForm = ({ initial, onSave, onCancel }) => {
        const [f, setF] = useState(
          initial || {
            companyName: '',
            contactName: '',
            contactEmail: '',
            contactPhone: '',
            engagementModel: 'Managed Sourcing',
            status: 'Active',
            notes: '',
          },
        );
        const s = (k, v) => setF((x) => ({ ...x, [k]: v }));
        return (
          <form
            onSubmit={(e) => {
              e.preventDefault();
              onSave({ ...f, id: f.id || uid('client') });
            }}
          >
            <div className="form-grid">
              <div className="form-group">
                <label>Company Name *</label>
                <input
                  required
                  value={f.companyName}
                  onChange={(e) => s('companyName', e.target.value)}
                />
              </div>
              <div className="form-group">
                <label>Contact Name *</label>
                <input
                  required
                  value={f.contactName}
                  onChange={(e) => s('contactName', e.target.value)}
                />
              </div>
              <div className="form-group">
                <label>Email *</label>
                <input
                  required
                  type="email"
                  value={f.contactEmail}
                  onChange={(e) => s('contactEmail', e.target.value)}
                />
              </div>
              <div className="form-group">
                <label>Phone</label>
                <input
                  type="tel"
                  value={f.contactPhone}
                  onChange={(e) => s('contactPhone', e.target.value)}
                />
              </div>
              <div className="form-group">
                <label>Engagement Model</label>
                <select
                  value={f.engagementModel}
                  onChange={(e) => s('engagementModel', e.target.value)}
                >
                  {[
                    'Managed Sourcing',
                    'Strategic Retainer',
                    'EOR',
                    'Hybrid',
                  ].map((m) => (
                    <option key={m}>{m}</option>
                  ))}
                </select>
              </div>
              <div className="form-group">
                <label>Status</label>
                <select
                  value={f.status}
                  onChange={(e) => s('status', e.target.value)}
                >
                  {['Active', 'Pending', 'Terminated'].map((x) => (
                    <option key={x}>{x}</option>
                  ))}
                </select>
              </div>
              <div className="form-group full">
                <label>Notes</label>
                <textarea
                  value={f.notes}
                  onChange={(e) => s('notes', e.target.value)}
                  rows={2}
                />
              </div>
            </div>
            <div className="form-actions">
              <button type="submit" className="btn btn-primary">
                <Ico.Save sz={13} />
                Save
              </button>
              <button
                type="button"
                className="btn btn-secondary"
                onClick={onCancel}
              >
                <Ico.X sz={13} />
                Cancel
              </button>
            </div>
          </form>
        );
      };

      // ── BID TRACKER ──
      const BidMod = ({ bids, onSave, onDelete }) => {
        const [showForm, setShowForm] = useState(false);
        const [editing, setEditing] = useState(null);
        return (
          <div>
            <div className="page-header">
              <div>
                <div className="page-title">Bid Tracker</div>
                <div className="page-sub">
                  Won bids auto-create client prompts · Link bids to
                  Solicitation Response
                </div>
              </div>
              <button
                className="btn btn-primary btn-sm"
                onClick={() => {
                  setEditing(null);
                  setShowForm(true);
                }}
              >
                <Ico.Plus sz={13} />
                Add Bid
              </button>
            </div>
            <div className="card">
              {bids.length === 0 ? (
                <div className="empty-state">
                  <Ico.Target sz={44} />
                  <p>No bids yet.</p>
                </div>
              ) : (
                <div style={{ overflowX: 'auto' }}>
                  <table>
                    <thead>
                      <tr>
                        <th>Solicitation</th>
                        <th>Agency</th>
                        <th>Value</th>
                        <th>Due</th>
                        <th>Set-Aside</th>
                        <th>Status</th>
                        <th></th>
                      </tr>
                    </thead>
                    <tbody>
                      {bids.map((b) => {
                        const d = daysUntil(b.dueDate);
                        return (
                          <tr key={b.id}>
                            <td>
                              <div className="td-p">{b.solicitationNumber}</div>
                              <div className="td-s">{b.title}</div>
                            </td>
                            <td>{b.agencyName}</td>
                            <td style={{ color: 'var(--gold)' }}>
                              {fmt$(b.estimatedValue)}
                            </td>
                            <td>
                              <span className={cdClass(d)}>
                                {d !== null
                                  ? d >= 0
                                    ? `${d}d`
                                    : 'Overdue'
                                  : '—'}
                              </span>
                              <div className="td-s">{fmtDate(b.dueDate)}</div>
                            </td>
                            <td>
                              {b.setAside && (
                                <span className="badge b-muted">
                                  {b.setAside}
                                </span>
                              )}
                            </td>
                            <td>
                              <span className={`badge ${sbadge(b.status)}`}>
                                {b.status}
                              </span>
                            </td>
                            <td>
                              <div style={{ display: 'flex', gap: '0.4rem' }}>
                                <button
                                  className="btn btn-icon btn-secondary"
                                  onClick={() => {
                                    setEditing(b);
                                    setShowForm(true);
                                  }}
                                >
                                  <Ico.Edit sz={13} />
                                </button>
                                <button
                                  className="btn btn-icon btn-secondary"
                                  style={{ color: 'var(--danger)' }}
                                  onClick={() => onDelete(b.id)}
                                >
                                  <Ico.Trash sz={13} />
                                </button>
                              </div>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
            {showForm && (
              <div className="modal-overlay">
                <div className="modal">
                  <div className="modal-hdr">
                    <div className="modal-title">
                      {editing ? 'Edit Bid' : 'New Bid'}
                    </div>
                    <button
                      className="btn btn-icon btn-secondary"
                      onClick={() => {
                        setShowForm(false);
                        setEditing(null);
                      }}
                    >
                      <Ico.X sz={13} />
                    </button>
                  </div>
                  <BidForm
                    initial={editing}
                    onSave={(d) => {
                      onSave(d);
                      setShowForm(false);
                      setEditing(null);
                    }}
                    onCancel={() => {
                      setShowForm(false);
                      setEditing(null);
                    }}
                  />
                </div>
              </div>
            )}
          </div>
        );
      };

      const BidForm = ({ initial, onSave, onCancel }) => {
        const [f, setF] = useState(
          initial || {
            solicitationNumber: '',
            title: '',
            agencyName: '',
            setAside: 'SDVOSB',
            estimatedValue: '',
            dueDate: '',
            status: 'Identified',
            notes: '',
          },
        );
        const s = (k, v) => setF((x) => ({ ...x, [k]: v }));
        return (
          <form
            onSubmit={(e) => {
              e.preventDefault();
              onSave({ ...f, id: f.id || uid('bid') });
            }}
          >
            <div className="form-grid">
              <div className="form-group">
                <label>Solicitation # *</label>
                <input
                  required
                  value={f.solicitationNumber}
                  onChange={(e) => s('solicitationNumber', e.target.value)}
                />
              </div>
              <div className="form-group">
                <label>Agency *</label>
                <input
                  required
                  value={f.agencyName}
                  onChange={(e) => s('agencyName', e.target.value)}
                />
              </div>
              <div className="form-group full">
                <label>Title *</label>
                <input
                  required
                  value={f.title}
                  onChange={(e) => s('title', e.target.value)}
                />
              </div>
              <div className="form-group">
                <label>Set-Aside</label>
                <select
                  value={f.setAside}
                  onChange={(e) => s('setAside', e.target.value)}
                >
                  {[
                    'SDVOSB',
                    'VetHUB',
                    'Small Business',
                    'Full & Open',
                    'HUBZone',
                    '8(a)',
                  ].map((x) => (
                    <option key={x}>{x}</option>
                  ))}
                </select>
              </div>
              <div className="form-group">
                <label>Est. Value ($)</label>
                <input
                  type="number"
                  step="0.01"
                  value={f.estimatedValue}
                  onChange={(e) => s('estimatedValue', e.target.value)}
                />
              </div>
              <div className="form-group">
                <label>Due Date *</label>
                <input
                  required
                  type="date"
                  value={f.dueDate}
                  onChange={(e) => s('dueDate', e.target.value)}
                />
              </div>
              <div className="form-group">
                <label>Status</label>
                <select
                  value={f.status}
                  onChange={(e) => s('status', e.target.value)}
                >
                  {[
                    'Identified',
                    'Reviewing',
                    'Writing Proposal',
                    'Submitted',
                    'Under Evaluation',
                    'Won',
                    'Lost',
                    'No Bid',
                  ].map((x) => (
                    <option key={x}>{x}</option>
                  ))}
                </select>
              </div>
              <div className="form-group full">
                <label>Notes</label>
                <textarea
                  value={f.notes}
                  onChange={(e) => s('notes', e.target.value)}
                  rows={2}
                />
              </div>
            </div>
            <div className="form-actions">
              <button type="submit" className="btn btn-primary">
                <Ico.Save sz={13} />
                Save
              </button>
              <button
                type="button"
                className="btn btn-secondary"
                onClick={onCancel}
              >
                <Ico.X sz={13} />
                Cancel
              </button>
            </div>
          </form>
        );
      };

      // ── DASHBOARD ──
      const Dashboard = ({ clients, bids, setMod }) => {
        const active = clients.filter((c) => c.status === 'Active').length;
        const activeBids = bids.filter(
          (b) => !['Won', 'Lost', 'No Bid'].includes(b.status),
        ).length;
        const pipeline = bids
          .filter((b) => !['Won', 'Lost', 'No Bid'].includes(b.status))
          .reduce((s, b) => s + (parseFloat(b.estimatedValue) || 0), 0);
        const won = bids
          .filter((b) => b.status === 'Won')
          .reduce((s, b) => s + (parseFloat(b.estimatedValue) || 0), 0);
        const urgent = bids.filter((b) => {
          const d = daysUntil(b.dueDate);
          return (
            d !== null &&
            d >= 0 &&
            d <= 7 &&
            !['Won', 'Lost', 'No Bid'].includes(b.status)
          );
        });
        const wonNoClient = bids
          .filter((b) => b.status === 'Won')
          .filter((b) => !clients.some((c) => c.sourceContractId === b.id));

        return (
          <div>
            <div className="page-header">
              <div>
                <div className="page-title">Operations Dashboard</div>
                <div className="page-sub">
                  {CO.name} ·{' '}
                  {new Date().toLocaleDateString('en-US', {
                    weekday: 'long',
                    month: 'long',
                    day: 'numeric',
                    year: 'numeric',
                  })}
                </div>
              </div>
            </div>
            <div className="stats-grid">
              {[
                {
                  l: 'Active Clients',
                  v: active,
                  s: `${clients.length} total`,
                },
                {
                  l: 'Active Bids',
                  v: activeBids,
                  s: urgent.length
                    ? `${urgent.length} urgent`
                    : 'No urgent deadlines',
                },
                { l: 'Pipeline', v: fmt$(pipeline), s: 'Active bids' },
                {
                  l: 'Won Contracts',
                  v: fmt$(won),
                  s: `${bids.filter((b) => b.status === 'Won').length} awards`,
                },
              ].map((x) => (
                <div key={x.l} className="stat-card">
                  <div className="stat-label">{x.l}</div>
                  <div
                    className="stat-val"
                    style={{
                      fontSize:
                        x.l.includes('$') || x.v > 999 ? '1.3rem' : '1.8rem',
                    }}
                  >
                    {x.v}
                  </div>
                  <div className="stat-sub">{x.s}</div>
                </div>
              ))}
            </div>
            <div className="two-col">
              <div className="card">
                <div className="card-hdr">
                  <div className="card-title">Urgent Deadlines</div>
                  <button
                    className="btn btn-secondary btn-sm"
                    onClick={() => setMod('bids')}
                  >
                    <Ico.ChevR sz={13} />
                    All Bids
                  </button>
                </div>
                {urgent.length === 0 ? (
                  <div
                    style={{
                      color: 'var(--muted)',
                      fontSize: '0.85rem',
                      padding: '1rem',
                      textAlign: 'center',
                    }}
                  >
                    No bids due within 7 days
                  </div>
                ) : (
                  urgent.map((b) => {
                    const d = daysUntil(b.dueDate);
                    return (
                      <div
                        key={b.id}
                        style={{
                          display: 'flex',
                          justifyContent: 'space-between',
                          alignItems: 'center',
                          padding: '0.6rem 0',
                          borderBottom: '1px solid rgba(197,160,40,0.08)',
                        }}
                      >
                        <div>
                          <div style={{ fontWeight: 600, fontSize: '0.88rem' }}>
                            {b.agencyName}
                          </div>
                          <div className="td-s">{b.solicitationNumber}</div>
                        </div>
                        <span
                          className={`${cdClass(d)}`}
                          style={{
                            fontFamily: 'Cinzel,serif',
                            fontWeight: 700,
                          }}
                        >
                          {d === 0 ? 'TODAY' : `${d}d`}
                        </span>
                      </div>
                    );
                  })
                )}
              </div>
              <div className="card">
                <div className="card-hdr">
                  <div className="card-title">Action Items</div>
                </div>
                {wonNoClient.length > 0 && (
                  <div
                    style={{
                      display: 'flex',
                      alignItems: 'center',
                      justifyContent: 'space-between',
                      padding: '0.5rem 0.75rem',
                      background: 'rgba(197,160,40,0.08)',
                      borderRadius: 4,
                      border: '1px solid rgba(197,160,40,0.18)',
                      marginBottom: '0.5rem',
                    }}
                  >
                    <span style={{ fontSize: '0.83rem' }}>
                      ⚡{' '}
                      <strong className="countdown-yellow">
                        {wonNoClient.length} Won Bid
                        {wonNoClient.length > 1 ? 's' : ''}
                      </strong>{' '}
                      <span style={{ color: 'var(--muted)' }}>
                        need client records
                      </span>
                    </span>
                    <button
                      className="btn btn-gold btn-sm"
                      onClick={() => setMod('clients')}
                    >
                      Create
                    </button>
                  </div>
                )}
                {urgent.length > 0 && (
                  <div
                    style={{
                      padding: '0.5rem 0.75rem',
                      background: 'rgba(139,0,0,0.1)',
                      borderRadius: 4,
                      border: '1px solid rgba(139,0,0,0.25)',
                      marginBottom: '0.5rem',
                      fontSize: '0.83rem',
                    }}
                  >
                    <span className="countdown-red">
                      ⚠ {urgent.length} bid{urgent.length > 1 ? 's' : ''} due
                      within 7 days
                    </span>
                  </div>
                )}
                <div
                  style={{
                    padding: '0.5rem 0.75rem',
                    background: 'rgba(37,99,235,0.06)',
                    borderRadius: 4,
                    border: '1px solid rgba(37,99,235,0.12)',
                    fontSize: '0.83rem',
                    color: 'var(--text2)',
                  }}
                >
                  Cap Statement updated:{' '}
                  <strong style={{ color: 'var(--text)' }}>
                    {active} clients
                  </strong>{' '}
                  ·{' '}
                  <strong style={{ color: 'var(--text)' }}>
                    {bids.filter((b) => b.status === 'Won').length} wins
                  </strong>{' '}
                  ·{' '}
                  <button
                    className="btn btn-secondary btn-sm"
                    style={{ marginLeft: '0.5rem' }}
                    onClick={() => setMod('capstatement')}
                  >
                    Open
                  </button>
                </div>
              </div>
            </div>
          </div>
        );
      };

      // ── PLACEHOLDER MODULE ──
      const PlaceholderMod = ({ title }) => (
        <div>
          <div className="page-header">
            <div className="page-title">{title}</div>
          </div>
          <div
            className="card"
            style={{ textAlign: 'center', padding: '3rem' }}
          >
            <div
              className="badge b-gold"
              style={{
                padding: '0.75rem 1.5rem',
                fontSize: '0.9rem',
                margin: '0 auto',
              }}
            >
              Coming Next Build
            </div>
            <p
              style={{
                color: 'var(--muted)',
                marginTop: '1rem',
                fontSize: '0.88rem',
              }}
            >
              This module will be connected in the next iteration.
            </p>
          </div>
        </div>
      );

      // ── MAIN APP ──
      const App = () => {
        const [mod, setMod] = useState('dashboard');
        const [clients, setClients] = useState([]);
        const [bids, setBids] = useState([]);
        const [loading, setLoading] = useState(true);

        useEffect(() => {
          loadData();
        }, []);

        const loadData = async () => {
          setLoading(true);
          const [c, b] = await Promise.all([
            API.get('get-clients'),
            API.get('get-bids'),
          ]);
          setClients(c);
          setBids(b);
          setLoading(false);
        };

        const saveClient = async (d) => {
          await API.post('save-client', d);
          await loadData();
        };
        const delClient = async (id) => {
          if (!confirm('Delete client?')) return;
          await API.del('delete-client', id);
          await loadData();
        };
        const saveBid = async (d) => {
          await API.post('save-bid', d);
          await loadData();
        };
        const delBid = async (id) => {
          if (!confirm('Delete bid?')) return;
          await API.del('delete-bid', id);
          await loadData();
        };

        const nav = [
          {
            s: 'Operations',
            items: [
              { id: 'dashboard', i: Ico.Home, l: 'Dashboard' },
              {
                id: 'clients',
                i: Ico.Bldg,
                l: 'Clients',
                badge: () =>
                  clients.filter((c) => c.status === 'Active').length,
              },
              {
                id: 'bids',
                i: Ico.Target,
                l: 'Bid Tracker',
                badge: () =>
                  bids.filter(
                    (b) => !['Won', 'Lost', 'No Bid'].includes(b.status),
                  ).length,
              },
              { id: 'requisitions', i: Ico.File, l: 'Requisitions' },
              { id: 'candidates', i: Ico.Users, l: 'Candidates' },
            ],
          },
          {
            s: 'Finance',
            items: [
              { id: 'revenue', i: Ico.Dollar, l: 'Revenue' },
              { id: 'invoicing', i: Ico.FCheck, l: 'Invoicing' },
              { id: 'supply', i: Ico.Pkg, l: 'Supply & PO' },
              { id: 'eor', i: Ico.UCheck, l: 'EOR Workforce' },
            ],
          },
          {
            s: 'Business Dev',
            items: [
              { id: 'capstatement', i: Ico.Award, l: 'Cap Statement' },
              { id: 'solicitation', i: Ico.FSig, l: 'Solicitation Response' },
              { id: 'compliance', i: Ico.Shield, l: 'Compliance' },
            ],
          },
        ];

        if (loading)
          return (
            <div>
              <Header />
              <div
                style={{
                  display: 'flex',
                  alignItems: 'center',
                  justifyContent: 'center',
                  height: 'calc(100vh - 90px)',
                  gap: '0.75rem',
                  color: 'var(--muted)',
                }}
              >
                <div className="spinner" style={{ width: 24, height: 24 }} />
                <span
                  style={{ fontFamily: 'Cinzel,serif', letterSpacing: '0.1em' }}
                >
                  Loading from cloud...
                </span>
              </div>
            </div>
          );

        return (
          <div>
            <Header />
            <div className="app">
              <aside className="sidebar">
                {nav.map((section) => (
                  <div key={section.s}>
                    <div className="sidebar-section">{section.s}</div>
                    {section.items.map(({ id, i: Icon, l, badge }) => {
                      const cnt = badge ? badge() : 0;
                      return (
                        <button
                          key={id}
                          className={`nav-btn ${mod === id ? 'active' : ''}`}
                          onClick={() => setMod(id)}
                        >
                          <Icon sz={14} />
                          <span>{l}</span>
                          {cnt > 0 && (
                            <span
                              className={`nav-badge ${
                                id === 'bids' &&
                                bids.some((b) => {
                                  const d = daysUntil(b.dueDate);
                                  return (
                                    d !== null &&
                                    d <= 7 &&
                                    !['Won', 'Lost', 'No Bid'].includes(
                                      b.status,
                                    )
                                  );
                                })
                                  ? 'red'
                                  : ''
                              }`}
                            >
                              {cnt}
                            </span>
                          )}
                        </button>
                      );
                    })}
                  </div>
                ))}
              </aside>
              <main className="main">
                {mod === 'dashboard' && (
                  <Dashboard clients={clients} bids={bids} setMod={setMod} />
                )}
                {mod === 'clients' && (
                  <ClientMod
                    clients={clients}
                    bids={bids}
                    onSave={saveClient}
                    onDelete={delClient}
                  />
                )}
                {mod === 'bids' && (
                  <BidMod bids={bids} onSave={saveBid} onDelete={delBid} />
                )}
                {mod === 'capstatement' && (
                  <CapStatement clients={clients} bids={bids} />
                )}
                {mod === 'solicitation' && (
                  <SolicitationResponse clients={clients} bids={bids} />
                )}
                {[
                  'requisitions',
                  'candidates',
                  'revenue',
                  'invoicing',
                  'supply',
                  'eor',
                  'compliance',
                ].includes(mod) && (
                  <PlaceholderMod
                    title={
                      nav.flatMap((s) => s.items).find((x) => x.id === mod)
                        ?.l || mod
                    }
                  />
                )}
              </main>
            </div>
          </div>
        );
      };

      ReactDOM.render(<App />, document.getElementById('root'));
    </script>
  </body>
</html>
